[package]
name = "playscreen-sentinel"
version = "0.1.0"
edition = "2021"
description = "Sentinelle Playscreen : écoute le méta-raccourci manette et lance Playscreen"
license = "MIT"

[[bin]]
name = "playscreen-sentinel"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
